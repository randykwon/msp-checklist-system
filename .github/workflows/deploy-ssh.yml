# =============================================================================
# MSP Checklist - SSH 방식 자동 배포
#
# 트리거: main 브랜치 push 또는 수동 실행
# 방식: SSH로 EC2에 직접 접속하여 배포 스크립트 실행
#
# 필요한 GitHub Secrets:
#   EC2_HOST     - EC2 퍼블릭 IP 또는 도메인 (예: mychecker.com)
#   EC2_USER     - SSH 사용자 (예: ec2-user)
#   EC2_SSH_KEY  - SSH 프라이빗 키 (PEM 파일 전체 내용)
# =============================================================================

name: 🚀 Deploy via SSH

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'SESSION_PROMPTS_HISTORY.md'
      - 'THEME_IMPLEMENTATION_PLAN.md'

  workflow_dispatch:
    inputs:
      deploy_target:
        description: '배포 대상 선택'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - main-only
          - admin-only
          - skip-build

concurrency:
  group: deploy-ssh
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 EC2 배포 (SSH)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📋 배포 정보
        run: |
          echo "🚀 SSH 배포 시작"
          echo "  트리거: ${{ github.event_name }}"
          echo "  브랜치: ${{ github.ref_name }}"
          echo "  커밋: ${{ github.sha }}"
          echo "  대상: ${{ github.event.inputs.deploy_target || 'all' }}"
          echo "  시간: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')"

      - name: 🔑 SSH 배포 실행
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_TARGET: ${{ github.event.inputs.deploy_target || 'all' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 600s
          envs: DEPLOY_TARGET
          script: |
            echo "=== EC2 배포 시작 ==="
            echo "대상: $DEPLOY_TARGET"
            
            # NVM 로드
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 20 2>/dev/null || true
            
            echo "Node: $(node -v 2>/dev/null || echo 'not found')"
            echo "npm: $(npm -v 2>/dev/null || echo 'not found')"
            
            # 프로젝트 디렉토리 이동
            if [ -d "/opt/msp-checklist-system" ]; then
              cd /opt/msp-checklist-system
            elif [ -d "$HOME/msp-qna-teams" ]; then
              cd "$HOME/msp-qna-teams"
            elif [ -d "$HOME/msp-qna" ]; then
              cd "$HOME/msp-qna"
            else
              echo "❌ 프로젝트 디렉토리를 찾을 수 없습니다"
              exit 1
            fi
            
            echo "프로젝트: $(pwd)"
            
            # 배포 옵션 설정
            DEPLOY_OPT=""
            case "$DEPLOY_TARGET" in
              main-only)  DEPLOY_OPT="--main-only" ;;
              admin-only) DEPLOY_OPT="--admin-only" ;;
              skip-build) DEPLOY_OPT="--skip-build" ;;
            esac
            
            # 배포 스크립트 실행
            if [ -f "scripts/deploy/ci-deploy.sh" ]; then
              chmod +x scripts/deploy/ci-deploy.sh
              bash scripts/deploy/ci-deploy.sh $DEPLOY_OPT
            else
              echo "❌ ci-deploy.sh를 찾을 수 없습니다"
              exit 1
            fi

      - name: 📊 배포 결과
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ SSH 배포 성공!"
            echo "  커밋: ${{ github.sha }}"
            echo "  시간: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')"
          else
            echo "❌ SSH 배포 실패!"
            echo "  커밋: ${{ github.sha }}"
            echo "  로그를 확인해주세요."
          fi
