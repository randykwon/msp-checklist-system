# =============================================================================
# MSP Checklist - SSM 방식 자동 배포
#
# 트리거: 수동 실행 (workflow_dispatch)
# 방식: AWS SSM Run Command로 EC2에 명령 전송 (SSH 불필요)
#
# 장점:
#   - SSH 22번 포트 오픈 불필요
#   - AWS IAM 기반 인증 (OIDC, 키 없음)
#   - 프라이빗 서브넷 EC2도 지원
#
# 필요한 GitHub Secrets:
#   AWS_ROLE_ARN      - GitHub OIDC용 IAM Role ARN
#   EC2_INSTANCE_ID   - EC2 인스턴스 ID (예: i-0abc123def456)
#
# 사전 설정:
#   1. EC2에 SSM Agent 설치 및 실행 확인
#   2. EC2 IAM Role에 AmazonSSMManagedInstanceCore 정책 연결
#   3. IAM OIDC Provider 생성 (token.actions.githubusercontent.com)
#   4. GitHub Actions용 IAM Role 생성 (SSM 권한)
# =============================================================================

name: 🔐 Deploy via SSM

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: '배포 대상 선택'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - main-only
          - admin-only
          - skip-build
      s3_backup:
        description: 'S3에 DB 백업'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-ssm
  cancel-in-progress: false

permissions:
  id-token: write    # OIDC 토큰 요청
  contents: read

jobs:
  deploy:
    name: 🔐 EC2 배포 (SSM)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📋 배포 정보
        run: |
          echo "🔐 SSM 배포 시작"
          echo "  트리거: ${{ github.event_name }}"
          echo "  브랜치: ${{ github.ref_name }}"
          echo "  커밋: ${{ github.sha }}"
          echo "  대상: ${{ github.event.inputs.deploy_target || 'all' }}"
          echo "  S3 백업: ${{ github.event.inputs.s3_backup || 'false' }}"
          echo "  시간: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')"

      - name: 🔑 AWS 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: ✅ SSM Agent 상태 확인
        run: |
          echo "EC2 인스턴스 SSM 연결 확인..."
          
          STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --query "InstanceInformationList[0].PingStatus" \
            --output text 2>/dev/null || echo "NotFound")
          
          if [ "$STATUS" = "Online" ]; then
            echo "✅ SSM Agent 온라인"
          else
            echo "❌ SSM Agent 상태: $STATUS"
            echo ""
            echo "확인사항:"
            echo "  1. EC2에 SSM Agent가 설치/실행 중인지 확인"
            echo "  2. EC2 IAM Role에 AmazonSSMManagedInstanceCore 정책 연결 확인"
            echo "  3. EC2 인스턴스 ID가 올바른지 확인: ${{ secrets.EC2_INSTANCE_ID }}"
            exit 1
          fi

      - name: 📤 SSM 배포 명령 전송
        id: ssm-command
        run: |
          # 배포 옵션 설정
          DEPLOY_OPT=""
          case "${{ github.event.inputs.deploy_target }}" in
            main-only)  DEPLOY_OPT="--main-only" ;;
            admin-only) DEPLOY_OPT="--admin-only" ;;
            skip-build) DEPLOY_OPT="--skip-build" ;;
          esac
          
          if [ "${{ github.event.inputs.s3_backup }}" = "true" ]; then
            DEPLOY_OPT="$DEPLOY_OPT --s3-backup"
          fi
          
          echo "배포 옵션: $DEPLOY_OPT"
          
          # SSM Run Command 전송
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 600 \
            --comment "GitHub Actions deploy: ${{ github.sha }}" \
            --parameters "commands=[
              'echo \"=== SSM 배포 시작 ===\"',
              'export NVM_DIR=\"/home/ec2-user/.nvm\"',
              '[ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"',
              'nvm use 20 2>/dev/null || true',
              'echo \"Node: \$(node -v 2>/dev/null || echo not-found)\"',
              'PROJECT_DIR=\"\"',
              'for dir in /opt/msp-checklist-system /home/ec2-user/msp-qna-teams /home/ec2-user/msp-qna; do [ -d \"\$dir\" ] && PROJECT_DIR=\"\$dir\" && break; done',
              'if [ -z \"\$PROJECT_DIR\" ]; then echo \"프로젝트 디렉토리 없음\"; exit 1; fi',
              'echo \"프로젝트: \$PROJECT_DIR\"',
              'cd \"\$PROJECT_DIR\"',
              'chmod +x scripts/deploy/ci-deploy.sh 2>/dev/null || true',
              'bash scripts/deploy/ci-deploy.sh $DEPLOY_OPT'
            ]" \
            --output text \
            --query "Command.CommandId")
          
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "📤 SSM Command 전송 완료: $COMMAND_ID"

      - name: ⏳ 배포 결과 대기
        id: wait-result
        run: |
          COMMAND_ID="${{ steps.ssm-command.outputs.command_id }}"
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          
          echo "⏳ 배포 완료 대기 중..."
          echo "  Command ID: $COMMAND_ID"
          echo "  Instance ID: $INSTANCE_ID"
          echo ""
          
          # 최대 15분 대기 (10초 간격, 90회)
          for i in $(seq 1 90); do
            RESULT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>/dev/null || echo '{"Status":"Pending"}')
            
            STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('Status','Pending'))" 2>/dev/null || echo "Pending")
            
            # 진행 상태 표시 (10회마다)
            if [ $((i % 3)) -eq 0 ] || [ "$STATUS" != "InProgress" -a "$STATUS" != "Pending" ]; then
              echo "  [$i] 상태: $STATUS"
            fi
            
            case "$STATUS" in
              Success)
                echo ""
                echo "✅ 배포 성공!"
                echo ""
                echo "=== 실행 로그 ==="
                echo "$RESULT" | python3 -c "
import sys, json
data = json.load(sys.stdin)
stdout = data.get('StandardOutputContent', '')
if stdout:
    print(stdout[-3000:] if len(stdout) > 3000 else stdout)
" 2>/dev/null || true
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo ""
                echo "❌ 배포 실패! (상태: $STATUS)"
                echo ""
                echo "=== 에러 로그 ==="
                echo "$RESULT" | python3 -c "
import sys, json
data = json.load(sys.stdin)
stderr = data.get('StandardErrorContent', '')
stdout = data.get('StandardOutputContent', '')
if stderr:
    print('STDERR:', stderr[-2000:] if len(stderr) > 2000 else stderr)
if stdout:
    print('STDOUT:', stdout[-2000:] if len(stdout) > 2000 else stdout)
" 2>/dev/null || true
                exit 1
                ;;
            esac
            
            sleep 10
          done
          
          echo "❌ 타임아웃 (15분 초과)"
          exit 1

      - name: 📊 배포 결과 요약
        if: always()
        run: |
          echo "═══════════════════════════════════════"
          if [ "${{ steps.wait-result.outcome }}" = "success" ]; then
            echo "✅ SSM 배포 성공"
          else
            echo "❌ SSM 배포 실패"
          fi
          echo "  커밋: ${{ github.sha }}"
          echo "  Command ID: ${{ steps.ssm-command.outputs.command_id }}"
          echo "  시간: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')"
          echo "═══════════════════════════════════════"
